<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Withdraw Balance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    .swal2-timer-progress-bar {
      background: #facc15 !important;
    }

    .glow-yellow {
      box-shadow: 0 0 5px rgba(234, 179, 8, 0.5);
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- Header -->
  <header class="bg-black w-full max-w-md shadow-md py-2 px-4 mb-6 mx-auto border-b border-gray-700 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="bg-purple-600 bg-opacity-30 border border-purple-500 text-purple-300 w-9 h-9 flex items-center justify-center font-bold rounded-full" style="font-family: 'Audiowide', cursive;">
        GJ
      </div>
      <h2 class="text-xl font-bold text-yellow-400" style="font-family: 'Audiowide', cursive;">Good Job</h2>
    </div>
    <div class="flex items-center gap-6 text-2xl text-gray-300">
      <i class="fa-solid fa-headset font-bold"></i>
      <div class="bg-gray-900 w-5 h-8 hover:border-purple-500 flex items-center justify-center rounded-sm border border-gray-700">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4">
    <h1 class="text-3xl font-bold text-center mb-6 text-yellow-400">💸 Withdraw Balance</h1>

    <div class="bg-gray-900 p-6 rounded-2xl shadow-lg border border-gray-700">
      <div class="flex flex-col gap-4">
        <!-- Custom Method Selector -->
        <div>
          <p class="block text-sm font-medium text-gray-300 mb-1">Select Method</p>
          <div id="withdrawMethodContainer" class="flex space-x-4">
            <div data-method="BKash" class="method-option flex-1 border border-gray-600 rounded-lg px-4 py-3 text-center cursor-pointer transition hover:border-indigo-500 text-gray-300">
              <i class="fas fa-wallet"></i>
              <span class="ml-2">bKash</span>
            </div>
            <div data-method="Nagad" class="method-option flex-1 border border-gray-600 rounded-lg px-4 py-3 text-center cursor-pointer transition hover:border-indigo-500 text-gray-300">
              <i class="fas fa-wallet"></i>
              <span class="ml-2">Nagad</span>
            </div>
            <div data-method="USDT" class="method-option flex-1 border border-gray-600 rounded-lg px-4 py-3 text-center cursor-pointer transition hover:border-indigo-500 text-gray-300">
              <i class="fas fa-coins"></i>
              <span class="ml-2">USDT</span>
            </div>
          </div>
          <input type="hidden" id="withdrawMethod" value="">
        </div>

        <input
          id="withdrawAmount"
          type="number"
          min="1"
          placeholder="Enter amount"
          class="border border-gray-600 rounded-md px-4 py-2 w-full bg-gray-800 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

        <input
          id="withdrawAddress"
          type="text"
          placeholder="Enter Number / Wallet Address"
          class="border border-gray-600 rounded-md px-4 py-2 w-full bg-gray-800 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

        <button onclick="withdraw()" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 w-full transition">
          Withdraw
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyCkYWvYNsg2-CR88Js6gcP2nXfvwI4TW30",
      authDomain: "bdwork-346d3.firebaseapp.com",
      projectId: "bdwork-346d3",
      storageBucket: "bdwork-346d3.appspot.com",
      messagingSenderId: "900963179093",
      appId: "1:900963179093:web:81e42d67bb31d603cc92dc",
      measurementId: "G-FM1YJ8E5GK"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, updateDoc, collection, addDoc, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUserData = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          currentUserData = { uid: user.uid, ...userDoc.data() };
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Error loading user: ' + err.message,
          position: 'top-end',
          background: '#1a202c',
          color: '#fff'
        });
      }
    });

    const methodOptions = document.querySelectorAll('.method-option');
    const hiddenMethodInput = document.getElementById('withdrawMethod');
    methodOptions.forEach(option => {
      option.addEventListener('click', () => {
        methodOptions.forEach(o => o.classList.remove('border-indigo-500', 'bg-indigo-50', 'text-indigo-700'));
        option.classList.add('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');
        hiddenMethodInput.value = option.getAttribute('data-method');
      });
    });

    window.withdraw = async function () {
      const amountInput = document.getElementById("withdrawAmount");
      const addressInput = document.getElementById("withdrawAddress");

      const amount = parseFloat(amountInput.value);
      const method = hiddenMethodInput.value.trim();
      const address = addressInput.value.trim();

      if (isNaN(amount) || amount <= 0) return Swal.fire({ icon: 'warning', text: 'Enter valid amount.', position: 'top-end', background: '#1a202c', color: '#fff' });
      if (!method) return Swal.fire({ icon: 'warning', text: 'Please select a withdrawal method.', position: 'top-end', background: '#1a202c', color: '#fff' });
      if (!address) return Swal.fire({ icon: 'warning', text: 'Please enter number or wallet address.', position: 'top-end', background: '#1a202c', color: '#fff' });
      if (!currentUserData) return Swal.fire({ icon: 'error', text: 'User data not loaded yet.', position: 'top-end', background: '#1a202c', color: '#fff' });

      const currentBalance = currentUserData.balance || 0;
      if (amount > currentBalance) return Swal.fire({ icon: 'error', text: 'Insufficient balance.', position: 'top-end', background: '#1a202c', color: '#fff' });

      try {
        await addDoc(collection(db, "withdraws"), {
          uid: currentUserData.uid,
          userId: currentUserData.uid,
          userEmail: currentUserData.email,
          amount: amount,
          method: method,
          address: address,
          timestamp: Timestamp.now(),
          status: "pending"
        });

        const newBalance = currentBalance - amount;
        await updateDoc(doc(db, "users", currentUserData.uid), { balance: newBalance });
        currentUserData.balance = newBalance;

        amountInput.value = "";
        hiddenMethodInput.value = "";
        addressInput.value = "";
        methodOptions.forEach(o => o.classList.remove('border-indigo-500', 'bg-indigo-50', 'text-indigo-700'));

        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: `Withdraw request of ৳${amount} submitted via ${method}!`,
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true,
          background: '#1a202c',
          color: '#fff'
        });

      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: err.message,
          position: 'top-end',
          background: '#1a202c',
          color: '#fff'
        });
      }
    };
  </script>
</body>
</html>
