<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deposit Balance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <main class="max-w-xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6 text-center">💰 Deposit Balance</h1>

    <form id="depositForm" class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100 space-y-4">
      <!-- Custom Method Selector -->
      <div>
        <p class="block text-sm font-medium text-gray-600 mb-1">Select Method</p>
        <div id="methodContainer" class="flex space-x-4">
          <div data-method="bKash" class="method-option flex-1 border border-gray-300 rounded-lg px-4 py-3 text-center cursor-pointer transition hover:border-blue-500">
            <i class="fas fa-wallet"></i>
            <span class="ml-2">bKash</span>
          </div>
          <div data-method="Nagad" class="method-option flex-1 border border-gray-300 rounded-lg px-4 py-3 text-center cursor-pointer transition hover:border-blue-500">
            <i class="fas fa-wallet"></i>
            <span class="ml-2">Nagad</span>
          </div>
          <div data-method="USDT" class="method-option flex-1 border border-gray-300 rounded-lg px-4 py-3 text-center cursor-pointer transition hover:border-blue-500">
            <i class="fas fa-coins"></i>
            <span class="ml-2">USDT</span>
          </div>
        </div>
        <input type="hidden" id="depositMethod" name="depositMethod" value="">
      </div>

      <div>
        <label for="depositAmount" class="block text-sm font-medium text-gray-600 mb-1">Amount</label>
        <input type="number" id="depositAmount" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Enter amount..." min="0" required>
      </div>

      <div>
        <label for="paymentAddress" class="block text-sm font-medium text-gray-600 mb-1">Payment Address / Sender Number</label>
        <input type="text" id="paymentAddress" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Enter your payment address..." required>
      </div>

      <div>
        <label for="transactionId" class="block text-sm font-medium text-gray-600 mb-1">Transaction ID</label>
        <input type="text" id="transactionId" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Enter transaction ID..." required>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
        Submit Deposit Request
      </button>
    </form>
  </main>

  <script type="module">
    // Firebase config and imports
    const firebaseConfig = {
      apiKey: "AIzaSyCkYWvYNsg2-CR88Js6gcP2nXfvwI4TW30",
      authDomain: "bdwork-346d3.firebaseapp.com",
      projectId: "bdwork-346d3",
      storageBucket: "bdwork-346d3.appspot.com",
      messagingSenderId: "900963179093",
      appId: "1:900963179093:web:81e42d67bb31d603cc92dc",
      measurementId: "G-FM1YJ8E5GK"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";
      else currentUser = user;
    });

    // Handle method selection
    const options = document.querySelectorAll('.method-option');
    const hiddenInput = document.getElementById('depositMethod');
    options.forEach(opt => {
      opt.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('border-blue-500', 'bg-blue-50'));
        opt.classList.add('border-blue-500', 'bg-blue-50');
        hiddenInput.value = opt.getAttribute('data-method');
      });
    });

    // Form submission
    document.getElementById("depositForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const method = hiddenInput.value;
      const amount = parseFloat(document.getElementById("depositAmount").value);
      const address = document.getElementById("paymentAddress").value.trim();
      const transactionId = document.getElementById("transactionId").value.trim();

      if (!method || isNaN(amount) || amount <= 0 || !address || !transactionId) {
        alert("Please select a method and fill in all fields correctly.");
        return;
      }

      try {
        await addDoc(collection(db, "deposits"), {
          uid: currentUser.uid,
          userId: currentUser.uid,
          userEmail: currentUser.email,
          amount,
          method,
          address,
          transactionId,
          timestamp: Timestamp.now(),
          status: "pending"
        });
        alert("Deposit request submitted successfully!");
        this.reset();
        hiddenInput.value = '';
        options.forEach(o => o.classList.remove('border-blue-500', 'bg-blue-50'));
      } catch (err) {
        alert("Error submitting deposit: " + err.message);
      }
    });
  </script>
</body>
</html>
